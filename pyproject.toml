[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-course-planner"
version = "1.0.0"
description = "Quarterly training planning for Best, Cleveland and Singapore"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.13.4",
    "uvicorn==0.30.6",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "langchain-openai>=0.3.0,<2",
    "langchain-core>=0.3.0,<2",
    "python-dotenv>=1.0.0,<2",
    "azure-functions>=1.20,<2",
]

[project.optional-dependencies]
dev = ["ruff==0.14.6", "pyright==1.1.407"]

[project.scripts]
planner = "course_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src/course_planner/models.py", "src/course_planner/settings.py", "src/course_planner/storage.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
