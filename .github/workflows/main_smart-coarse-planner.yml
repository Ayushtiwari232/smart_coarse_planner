name: Test and deploy course planner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check src tests tools main.py function_app.py
      - run: python -m ruff format --check src tests tools main.py function_app.py
      - run: python -m pyright
      - run: python -m unittest discover -s tests -v
      - run: python -c "import main, function_app"

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: planner-release
          path: dist/release.zip

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: package
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: planner-release
      - uses: Azure/functions-action@v1
        with:
          app-name: smart-course-planner
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_50B4692A5D6942A2A30F76EFF243326F }}
          sku: flexconsumption
          remote-build: true
